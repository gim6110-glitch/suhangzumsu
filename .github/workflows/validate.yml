name: Validate ScoreGuard
concurrency:
  group: scoreguard-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check scanner-v2.js
          node --check plan-import-v2.js
          node --check scoreguard-v3.js
      - name: Reference data and table scan
        run: |
          node tests/verify.mjs
          node tests/v3-safety.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.58.2 pdf-lib@1.17.1
          npx playwright install chromium
      - name: Headless browser integration
        run: node tests/browser-smoke.mjs
      - name: OCR browser test using a synthetic scanned PDF
        run: node tests/ocr-browser.mjs
